[[local|localrc]]
# 'nomoresecret' is DevStack's documented sample default, not a leaked secret.
# A real deployment must change it (and the three passwords below).
ADMIN_PASSWORD=nomoresecret
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

DATABASE_TYPE=mysql
FORCE=yes

# This will now be evaluated INSIDE the VM, not on your host
HOST_IP=$(ip addr show enp1s0 | grep "inet " | awk '{print $2}' | cut -d/ -f1)

# OVN TUNNELING CONFIG
Q_ML2_TENANT_NETWORK_TYPE=geneve
Q_ML2_PLUGIN_MECHANISM_DRIVERS=ovn
Q_ML2_PLUGIN_TYPE_DRIVERS=local,flat,vlan,geneve

ENABLED_SERVICES=key,n-api,n-crt,n-obj,n-cpu,n-sch,n-cond,n-api-meta,g-api,g-reg,placement-api,placement-client,q-svc,neutron,q-ovn-metadata-agent,ovn-northd,ovn-controller,mysql,rabbit

# EXTERNAL CONNECTIVITY
Q_USE_PROVIDERNET_FOR_EXTERNAL=True
PUBLIC_INTERFACE=enp2s0
FLOATING_RANGE=192.168.122.200/29

OVS_PHYSICAL_BRIDGE=br-ex
PUBLIC_BRIDGE=br-ex
OVS_BRIDGE_MAPPINGS=public:br-ex


# MINIMAL CINDER
ENABLED_SERVICES+=,c-api,c-vol,c-sch
VOLUME_BACKING_FILE_SIZE=20G

LIBVIRT_TYPE=kvm
LOGFILE=$DEST/logs/stack.sh.log
LOGDAYS=2
