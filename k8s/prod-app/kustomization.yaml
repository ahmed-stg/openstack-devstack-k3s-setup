apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
images:
  # REGISTRY_PLACEHOLDER is substituted with $REGISTRY_INTERNAL_IP:5000 at
  # apply time (lib/common.sh:k8s_apply), because the address changes on
  # every rebuild and kustomize has no environment expansion.
  - name: prod-app
    newName: REGISTRY_PLACEHOLDER/my-app
    newTag: v1
